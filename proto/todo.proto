syntax = "proto3";

package todo;

option go_package = "github.com/example/todo/proto";

// The Todo service definition
service TodoService {
  rpc CreateTodo(CreateTodoRequest) returns (CreateTodoResponse);
  rpc ListTodos(ListTodosRequest)   returns (ListTodosResponse);
  rpc CompleteTodo(CompleteTodoRequest) returns (CompleteTodoResponse);
  rpc DeleteTodo(DeleteTodoRequest) returns (DeleteTodoResponse);
}

// --- Messages ---

message Todo {
  string id        = 1;
  string title     = 2;
  bool   completed = 3;
  string created_at = 4;
}

message CreateTodoRequest  { string title = 1; }
message CreateTodoResponse { Todo todo    = 1; }

message ListTodosRequest   {}
message ListTodosResponse  { repeated Todo todos = 1; }

message CompleteTodoRequest  { string id = 1; }
message CompleteTodoResponse { Todo todo = 1; }

message DeleteTodoRequest  { string id      = 1; }
message DeleteTodoResponse { bool   success = 1; }
